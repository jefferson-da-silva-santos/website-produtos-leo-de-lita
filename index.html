<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (até ~60 caracteres) -->
    <title>
      Produtos Léo de Lita | Sabor e Qualidade em Cada Mordida
    </title>

    <!-- SEO Description (até ~160 caracteres) -->
    <meta
      name="description"
      content="Produtos Léo de Lita é referência em bolachas artesanais. Sabor, qualidade e comprometimento em cada mordida. Conheça nossos produtos!"
    />

    <!-- SEO Keywords (opcional, leve e natural) -->
    <meta
      name="keywords"
      content="Produtos Léo de Lita, bolachas artesanais, bolacha doce, bolacha salgada, bolacha suíça, produtos artesanais, sabor e qualidade"
    />

    <!-- Author & Brand -->
    <meta name="author" content="Produtos Léo de Lita" />
    <meta name="application-name" content="Produtos Léo de Lita" />

    <!-- Indexação -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://bolachasleodelita.com.br" />

    <!-- Fonte -->
    <link
      href="https://fonts.cdnfonts.com/css/sk-concretica"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="https://raw.githubusercontent.com/jefferson-da-silva-santos/imagens-projetos/refs/heads/main/BolachasLeoDeLita/favicon.ico"
      type="image/x-icon"
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Produtos Léo de Lita | Sabor e Qualidade" />
    <meta
      property="og:description"
      content="Sabor e qualidade em cada mordida. Conheça as bolachas artesanais Léo de Lita e descubra produtos deliciosos para todos os gostos."
    />
    <meta property="og:url" content="https://bolachasleodelita.com.br" />
    <meta
      property="og:site_name"
      content="Produtos Léo de Lita"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/jefferson-da-silva-santos/imagens-projetos/refs/heads/main/BolachasLeoDeLita/og-image.webp"
    />
    <meta property="og:image:alt" content="Produtos artesanais Léo de Lita" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Produtos Léo de Lita | Sabor Artesanal" />
    <meta
      name="twitter:description"
      content="Produtos artesanais com sabor e qualidade. Conheça as bolachas Léo de Lita."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/jefferson-da-silva-santos/imagens-projetos/refs/heads/main/BolachasLeoDeLita/og-image.webp"
    />

    <!-- Tema (mobile browsers) -->
    <meta name="theme-color" content="#2c1a8a" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
